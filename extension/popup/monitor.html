<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Autimik — Fill Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      height: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0f1e;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #1e293b;
      background: #0f172a;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      color: #60a5fa;
      letter-spacing: 0.4px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #1e293b;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    .spinner.done { animation: none; border-color: #22c55e; border-top-color: #22c55e; }
    .spinner.fail { animation: none; border-color: #ef4444; border-top-color: #ef4444; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .vehicle-bar {
      padding: 7px 14px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .vehicle-bar span { color: #e2e8f0; font-weight: 600; }

    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      background: #060d1a;
    }
    .log-area::-webkit-scrollbar { width: 3px; }
    .log-area::-webkit-scrollbar-track { background: transparent; }
    .log-area::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 2px 0;
      color: #64748b;
      line-height: 1.5;
    }
    .log-entry .ts { color: #334155; flex-shrink: 0; }
    .log-entry .msg { color: #94a3b8; }
    .log-entry.step .msg { color: #60a5fa; }
    .log-entry.done .msg { color: #22c55e; font-weight: 600; }
    .log-entry.fail .msg { color: #f87171; font-weight: 600; }
    .log-entry.info .msg { color: #cbd5e1; }

    .status-bar {
      padding: 7px 14px;
      border-top: 1px solid #1e293b;
      background: #0f172a;
      font-size: 11px;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .status-bar.active { color: #60a5fa; }
    .status-bar.done { color: #22c55e; }
    .status-bar.fail { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="spinner" id="spinner"></div>
      <div class="header-title">Fill Monitor</div>
    </div>
  </div>
  <div class="vehicle-bar" id="vehicleBar">Preparing...</div>
  <div class="log-area" id="logArea"></div>
  <div class="status-bar" id="statusBar">Starting...</div>

  <script src="monitor.js"></script>
</body>
</html>
